# Vérifie l'environnement du serveur de production : compte qui exécute le runner, version de PHP,
# extensions dont l'application a besoin et place disque. Les commandes ne font que lire, elles ne
# modifient rien sur le serveur. Le résultat se lit dans le journal de l'exécution, sur GitHub.
name: Vérification du runner

# Lancement manuel uniquement : onglet Actions du dépôt, workflow « Vérification du runner », bouton
# « Run workflow », ou en ligne de commande `gh workflow run check-runner.yaml --repo sfaut/portfolios`.
# GitHub lance la version du fichier présente sur la branche par défaut du dépôt distant.
on: workflow_dispatch

jobs:
  check:
    # La tâche part vers le runner auto-hébergé installé sur le serveur de production (prod-origen3),
    # qui porte les étiquettes `self-hosted` et `production`, et s'exécute sur ce serveur.
    runs-on: [self-hosted, production]
    steps:
      - run: |
          # Compte système sous lequel tourne le runner.
          whoami
          # Version de PHP en ligne de commande, celle qu'utilisent composer et artisan.
          php -v
          # Extensions attendues : intl et pdo_mysql (déclarées dans composer.json), mbstring (demandée
          # par Laravel) et OPcache (performances). Seules les extensions présentes s'affichent, OPcache
          # deux fois (module PHP et module Zend).
          php -m | grep -Ei 'pdo_mysql|intl|mbstring|opcache'
          # Taille, occupation et place libre du système de fichiers qui contient /var/www.
          df -h /var/www
